<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Топ-5 нейросетей для сайтов — 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0B0C10;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;
    background:radial-gradient(130% 80% at 50% 0%,#171A22 0%,#0E1015 55%,#08090C 100%);
    font-family:"Inter",Arial,sans-serif;color:#F2F3F7;transform-origin:center center}
  #stage::before{content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.05) 1.2px,transparent 1.2px);
    background-size:36px 36px}
  #glowA,#glowB{position:absolute;width:900px;height:900px;border-radius:50%;filter:blur(140px);opacity:.5;pointer-events:none}
  #glowA{background:#2B3BFF;top:-350px;left:-250px}
  #glowB{background:#FF7A1A;bottom:-400px;right:-300px;opacity:.28}
  /* верхний прогресс */
  #pwrap{position:absolute;top:64px;left:70px;right:70px}
  #plabel{display:flex;justify-content:space-between;font-size:30px;font-weight:800;
    letter-spacing:4px;color:#8B90A0;text-transform:uppercase;margin-bottom:14px}
  #plabel b{color:#FFD23F}
  #pbar{height:10px;border-radius:6px;background:rgba(255,255,255,.09);overflow:hidden}
  #pfill{height:100%;width:0%;border-radius:6px;
    background:linear-gradient(90deg,#FFD23F,#FF7A1A);transition:width .6s cubic-bezier(.2,.9,.25,1.2)}
  /* контент */
  #rank{position:absolute;top:180px;left:60px;font-size:460px;font-weight:900;line-height:.85;
    color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.10);letter-spacing:-14px}
  #rank.solid{color:#FFD23F;-webkit-text-stroke:0;text-shadow:0 0 120px rgba(255,210,63,.45)}
  #logo{position:absolute;top:250px;left:70px;width:190px;height:190px;border-radius:44px;
    background:#151822;border:2px solid rgba(255,255,255,.10);display:flex;align-items:center;justify-content:center;
    box-shadow:0 30px 80px rgba(0,0,0,.5)}
  #logo img{width:110px;height:110px;filter:brightness(0) invert(1)}
  #card{position:absolute;top:520px;left:70px;right:70px}
  #vendor{font-size:34px;font-weight:800;letter-spacing:3px;color:#8B90A0;text-transform:uppercase;margin-bottom:14px}
  #name{font-size:86px;font-weight:900;line-height:1.02;letter-spacing:-2px;margin-bottom:26px}
  #name .hl{color:#FFD23F}
  #tag{font-size:40px;font-weight:500;line-height:1.35;color:#C6CAD6;max-width:840px}
  #stats{position:absolute;top:1080px;left:70px;right:70px;display:flex;gap:26px}
  .stat{flex:1;background:rgba(255,255,255,.045);border:2px solid rgba(255,255,255,.09);
    border-radius:28px;padding:34px 30px;opacity:0;transform:translateY(40px);
    transition:opacity .5s,transform .5s cubic-bezier(.2,.9,.3,1.3)}
  .stat.on{opacity:1;transform:translateY(0)}
  .stat .v{font-size:64px;font-weight:900;color:#FFD23F;letter-spacing:-1px}
  .stat .k{font-size:26px;font-weight:700;color:#8B90A0;text-transform:uppercase;letter-spacing:2px;margin-top:10px}
  /* маскот-уголок */
  #mascotCorner{position:absolute;bottom:230px;right:60px;width:150px;opacity:0;
    transform:rotate(8deg) scale(.6);transition:opacity .6s,transform .6s cubic-bezier(.2,.9,.3,1.4)}
  #mascotCorner.on{opacity:.92;transform:rotate(4deg) scale(1)}
  /* субтитры */
  #subs{position:absolute;bottom:70px;left:70px;right:70px;min-height:120px;
    font-size:44px;font-weight:700;line-height:1.3;text-align:center;color:#E8EAF0}
  #subs .w{display:inline-block;margin:0 5px;opacity:0;transform:translateY(14px)}
  #subs .w.show{opacity:1;transform:translateY(0);transition:opacity .18s,transform .18s}
  #subs .w.acc{color:#FFD23F}
  /* финал */
  #final{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center}
  #final.on{display:flex}
  #fmascot{width:430px;margin-bottom:40px;animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-26px) rotate(2deg)}}
  #ftitle{font-size:88px;font-weight:900;line-height:1.08;letter-spacing:-2px;max-width:900px;margin-bottom:30px}
  #ftitle .hl{color:#FFD23F}
  #fsub{font-size:42px;font-weight:700;color:#C6CAD6;margin-bottom:46px}
  #fbtn{display:inline-block;background:linear-gradient(90deg,#FFD23F,#FF7A1A);color:#141414;
    font-size:44px;font-weight:900;padding:26px 64px;border-radius:60px;letter-spacing:.5px}
  #fhint{margin-top:34px;font-size:32px;font-weight:700;color:#8B90A0}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="glowA"></div><div id="glowB"></div>
  <div id="pwrap">
    <div id="plabel"><span>Топ-5 нейросетей для сайтов · 2026</span><b id="pnum">—</b></div>
    <div id="pbar"><div id="pfill"></div></div>
  </div>
  <div id="rank"></div>
  <div id="logo"><img id="logoImg" alt=""></div>
  <div id="card">
    <div id="vendor"></div>
    <div id="name"></div>
    <div id="tag"></div>
  </div>
  <div id="stats"></div>
  <img id="mascotCorner" src="mascot.png" alt="">
  <div id="subs"></div>
  <div id="final">
    <img id="fmascot" src="mascot.png" alt="">
    <div id="ftitle">А самые <span class="hl">дёшёвые лиды</span> для твоего веб-девелопмента — <span class="hl">у нас в профиле</span></div>
    <div id="fsub">Первым — 49 ₽. Пока не разобрали.</div>
    <div id="fbtn">Telegram →</div>
    <div id="fhint">Ссылка в шапке профиля</div>
  </div>
</div></div>
<script>
const ICON = s => "https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/" + s + ".svg";
/* слова озвучки по сценам; acc — подсветить */
const SCENES = [
 {t0:0.3, t1:3.4, rank:null, words:"Топ пять нейросетей для создания сайтов. Двести двадцать шесть год.|".split("|"),
  setup:null},
 {t0:3.4, t1:8.6, rank:5, vendor:"DeepSeek", name:'DeepSeek <span class="hl">V4.1 Flash</span>',
  logo:ICON("deepseek"), tag:"Открытые веса, копеечный API и контекст на миллион токенов.",
  stats:[["1M","контекст, токенов"],["$0.60","цена за 1M выхода, $"],["MIT","лицензия — бери бесплатно"]],
  words:"Пятое место — DeepSeek V4.1 Flash. Открытые веса, копеечный API, миллион токенов контекста."},
 {t0:8.6, t1:13.6, rank:4, vendor:"xAI", name:'Grok <span class="hl">4.7</span>',
  logo:ICON("x"), tag:"Кодинг уровня флагманов за цену, от которой конкурентам больно.",
  stats:[["$2","за 1M входа, $"],["500K","контекст, токенов"],["Cursor","встроен в редактор"]],
  words:"Четвёртое место — Grok 4.7 от Икс-Ай. Кодинг уровня флагманов за два доллара за миллион токенов."},
 {t0:13.6, t1:18.6, rank:3, vendor:"Google", name:'Gemini <span class="hl">3.8 Flash</span>',
  logo:ICON("google"), tag:"Мультимодальность и скорость. Цена до конца года — подарок.",
  stats:[["1M","контекст, токенов"],["x10","дешевле флагманов"],["AI","экосистема Google"]],
  words:"Третье место — Gemini 3.8 Flash от Гугл. Мультимодальность и цена, от которой больно конкурентам."},
 {t0:18.6, t1:23.6, rank:2, vendor:"OpenAI", name:'GPT-6 <span class="hl">Astra</span>',
  logo:ICON("openai"), tag:"Агент, который сам управляет программами и собирает сайт по шагам.",
  stats:[["1786","WebDev Arena, Elo"],["agents","компьютер-юз"],["1M","контекст, токенов"]],
  words:"Второе место — GPT-6 Astra от Опен-эй-Ай. Агент, который сам управляет программами."},
 {t0:23.6, t1:29.6, rank:1, vendor:"Anthropic", name:'Claude Opus <span class="hl">5.5</span>',
  logo:ICON("anthropic"), tag:"Абсолютный рекорд WebDev Arena. Сильнейшая модель для кода сегодня.",
  stats:[["1813","WebDev Arena, Elo"],["#1","сильнейшая для кода"],["1M","контекст, токенов"]],
  words:"И первое место — Claude Opus 5.5 от Антропик. Восемнадцать тринадцать на WebDev Арене — абсолютный рекорд."},
 {t0:29.6, t1:41.0, rank:null, final:true,
  words:"А самые дешёвые лиды для твоего веб-девелопмента — у нас в профиле. Первым — сорок девять рублей."}
];
const ACC = ["первое","второе","третье","четвёртое","пятое","место","рекорд","дёшёвые","дешевле","лиды","профиле","flash","grok","gemini","astra","opus","claude","deepseek","v4.1","4.7","3.8","gpt-6","5.5","49","двадцать","сорок"];
const subs=document.getElementById('subs'), rank=document.getElementById('rank'),
  logoEl=document.getElementById('logo'), logoImg=document.getElementById('logoImg'),
  vendor=document.getElementById('vendor'), nameEl=document.getElementById('name'),
  tag=document.getElementById('tag'), stats=document.getElementById('stats'),
  pnum=document.getElementById('pnum'), pfill=document.getElementById('pfill'),
  fin=document.getElementById('final'), mc=document.getElementById('mascotCorner');
const start=performance.now();
function fit(){const s=document.getElementById('stage');const k=Math.min(innerWidth/1080,innerHeight/1920);s.style.transform='scale('+k+')'}
addEventListener('resize',fit);fit();
SCENES.forEach(sc=>{if(!sc.words)return;
  sc.wordList=sc.words.split(/\s+/).filter(Boolean);sc.spans=[];
  sc.wordList.forEach(w=>{const sp=document.createElement('span');sp.className='w';sp.textContent=w;
    if(ACC.some(a=>w.toLowerCase().includes(a)))sp.classList.add('acc');subs.appendChild(sp);sc.spans.push(sp)});
});
logoImg.onerror=()=>{logoEl.style.display='none'};
document.getElementById('fmascot').onerror=function(){this.style.display='none'};
let curScene=-1, mascotShown=false;
function showScene(i){const sc=SCENES[i];curScene=i;
  subs.innerHTML='';sc.spans=[];
  sc.wordList.forEach(w=>{const sp=document.createElement('span');sp.className='w';sp.textContent=w;
    if(ACC.some(a=>w.toLowerCase().includes(a)))sp.classList.add('acc');subs.appendChild(sp);sc.spans.push(sp)});
  if(sc.final){rank.style.display='none';logoEl.style.display='none';document.getElementById('card').style.display='none';stats.style.display='none';mc.classList.remove('on');
    fin.classList.add('on');pnum.textContent='★';pfill.style.width='100%';return}
  fin.classList.remove('on');document.getElementById('card').style.display='block';stats.style.display='flex';
  if(sc.setup===null){rank.style.display='none';logoEl.style.display='none';vendor.textContent='';nameEl.textContent='';tag.textContent='';stats.innerHTML='';pnum.textContent='—';pfill.style.width='4%';return}
  rank.style.display='block';logoEl.style.display='flex';
  rank.textContent=sc.rank;rank.classList.toggle('solid',sc.rank===1);
  logoImg.src=sc.logo;vendor.textContent=sc.vendor;nameEl.innerHTML=sc.name;tag.textContent=sc.tag;
  stats.innerHTML=sc.stats.map(s=>'<div class="stat"><div class="v">'+s[0]+'</div><div class="k">'+s[1]+'</div></div>').join('');
  pnum.textContent=sc.rank+' / 5';pfill.style.width=(sc.rank/5*100)+'%';
  setTimeout(()=>stats.querySelectorAll('.stat').forEach((el,j)=>setTimeout(()=>el.classList.add('on'),120*j)),350);
  if(!mascotShown){mascotShown=true;setTimeout(()=>mc.classList.add('on'),900)}
}
function tick(){const t=(performance.now()-start)/1000;
  for(let i=SCENES.length-1;i>=0;i--){if(t>=SCENES[i].t0){if(curScene!==i)showScene(i);break}}
  const sc=SCENES[Math.max(curScene,0)];
  if(sc&&sc.spans&&sc.spans.length){const p=Math.min(1,Math.max(0,(t-sc.t0)/(sc.t1-sc.t0-0.35)));
    const n=Math.floor(p*sc.spans.length);sc.spans.forEach((sp,j)=>sp.classList.toggle('show',j<n))}
  requestAnimationFrame(tick)}
requestAnimationFrame(tick);
</script>
</body>
</html>
